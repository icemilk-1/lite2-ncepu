<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四足机器狗导航 · 10 篇顶刊方案思维导图</title>
<style>
:root {
  --bg0: #070b12;
  --bg1: #0c1420;
  --panel: #0e1724;
  --line: #1e2c3d;
  --txt: #dfe9f5;
  --dim: #8ea2b8;
  --accent: #4cc9f0;
  --c1: #4cc9f0;
  --c2: #f72585;
  --c3: #ffd166;
  --c4: #7bf1a8;
  --c5: #b388ff;
  --c6: #ff9e6d;
  --c7: #5ad0c4;
  --c8: #9fb3c8;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background:
    radial-gradient(1200px 700px at 12% -10%, #10233a 0%, transparent 60%),
    radial-gradient(900px 600px at 100% 110%, #1a1230 0%, transparent 55%),
    var(--bg0);
  color: var(--txt);
  font-family: "Inter", "Segoe UI", system-ui, -apple-system, "Noto Sans SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.app { display: flex; flex-direction: column; height: 100vh; }

header {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(14, 23, 36, 0.96), rgba(9, 14, 22, 0.86));
  backdrop-filter: blur(8px);
  flex: 0 0 auto;
  z-index: 20;
}

.brand { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.brand h1 { margin: 0; font-size: 17px; letter-spacing: 0.3px; font-weight: 650; white-space: nowrap; }
.brand .sub { font-size: 11.5px; color: var(--dim); display: flex; gap: 10px; flex-wrap: wrap; }
.brand .sub b { color: var(--accent); font-weight: 600; }

.toolbar { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }

button.tb {
  border: 1px solid var(--line);
  background: #101b29;
  color: var(--txt);
  font: inherit;
  font-size: 12.5px;
  padding: 6px 11px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.16s;
  white-space: nowrap;
}
button.tb:hover { border-color: #2f4a67; background: #16273a; }
button.tb.on { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 1px rgba(76, 201, 240, 0.25) inset; }

.search {
  display: flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: #0b1521;
  border-radius: 8px;
  padding: 5px 9px;
}
.search input {
  border: 0; outline: 0; background: transparent; color: var(--txt);
  font: inherit; font-size: 12.5px; width: 150px;
}
.search input::placeholder { color: #5f7488; }
.search svg { flex: 0 0 auto; opacity: 0.6; }

main { position: relative; flex: 1 1 auto; overflow: hidden; }

#canvas { position: absolute; inset: 0; cursor: grab; }
#canvas.dragging { cursor: grabbing; }
#canvas svg { width: 100%; height: 100%; display: block; }

/* ---- nodes ---- */
.node { cursor: pointer; }
.node .hit { fill: transparent; transition: fill 0.15s; }
.node:hover .hit { fill: rgba(76, 201, 240, 0.09); }
.node text { pointer-events: none; user-select: none; }
.node.root text { font-size: 19px; font-weight: 700; letter-spacing: 0.4px; }
.node.d1 text { font-size: 15px; font-weight: 640; }
.node.d2 text { font-size: 13px; font-weight: 500; }
.node.d3 text { font-size: 12.5px; font-weight: 400; }
.node .dot { transition: 0.16s; }
.node:hover .dot { r: 6; }
.node.dim { opacity: 0.16; }
.node.hit-match .label { fill: #fff; }
.node.hit-match .dot { stroke: #fff; stroke-width: 2; }
.node.sel .label { fill: #fff; font-weight: 700; }
.node.sel .dot { r: 7.5; stroke: #fff; stroke-width: 2.4; }
.node .tag { fill: #6f869c; font-size: 10.5px; }
.node .badge { fill: #0d1a28; stroke: #2b4661; }
.node .plus { fill: #0b1521; stroke: #3a5876; }
.node .plusTxt { fill: #9fc4e0; font-size: 10px; font-weight: 700; text-anchor: middle; }
.node.root .pillbg { fill: url(#rootGrad); stroke: #56d3f5; stroke-width: 1.2; }

.link { fill: none; stroke-linecap: round; }
.link.d1 { stroke-width: 2; opacity: 0.85; }
.link.d2 { stroke-width: 1.5; opacity: 0.6; }
.link.d3 { stroke-width: 1.1; opacity: 0.45; }
.link.dim { opacity: 0.05; }
.link.hl { opacity: 1; stroke-width: 2.6; }

/* ---- side panel ---- */
#panel {
  position: absolute;
  top: 14px; right: 14px; bottom: 14px;
  width: 392px;
  background: linear-gradient(180deg, rgba(16, 26, 40, 0.97), rgba(10, 16, 25, 0.97));
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55);
  padding: 16px 18px 18px;
  overflow-y: auto;
  transform: translateX(calc(100% + 24px));
  transition: transform 0.26s cubic-bezier(0.22, 0.61, 0.36, 1);
  z-index: 15;
}
#panel.open { transform: translateX(0); }
#panel::-webkit-scrollbar { width: 8px; }
#panel::-webkit-scrollbar-thumb { background: #1e3048; border-radius: 8px; }

.p-top { display: flex; align-items: flex-start; gap: 10px; }
.p-close {
  margin-left: auto; border: 0; background: #16263a; color: var(--dim);
  width: 26px; height: 26px; border-radius: 7px; cursor: pointer; font-size: 15px; line-height: 1;
}
.p-close:hover { color: #fff; background: #1f3a52; }
.p-venue { font-size: 11px; color: var(--accent); letter-spacing: 0.6px; text-transform: uppercase; }
#panel h2 { margin: 6px 0 4px; font-size: 17px; line-height: 1.32; font-weight: 650; }
#panel .en { font-size: 12px; color: var(--dim); line-height: 1.45; font-style: italic; }
.meta { display: grid; grid-template-columns: 58px 1fr; gap: 5px 10px; margin: 12px 0 4px; font-size: 12px; }
.meta .k { color: #6f869c; }
.meta .v { color: #c6d6e6; word-break: break-all; }
.meta a { color: var(--accent); text-decoration: none; }
.meta a:hover { text-decoration: underline; }

.p-sec { margin-top: 14px; }
.p-sec h3 {
  margin: 0 0 7px; font-size: 12px; letter-spacing: 1.2px; color: #7f97ae;
  text-transform: uppercase; font-weight: 600;
  display: flex; align-items: center; gap: 7px;
}
.p-sec h3::before { content: ''; width: 3px; height: 12px; border-radius: 2px; background: var(--accent); }
.p-sec.innov h3::before { background: var(--c4); }
.p-sec.limit h3::before { background: #ff7b7b; }
.p-sec ul { margin: 0; padding-left: 16px; }
.p-sec li { font-size: 12.5px; line-height: 1.62; color: #b9cbdd; margin-bottom: 5px; }
.p-sec li::marker { color: #3f5a76; }

/* ---- table view ---- */
#tableview {
  position: absolute; inset: 0; padding: 20px 22px 28px; overflow: auto; display: none;
}
#tableview.show { display: block; }
#tableview::-webkit-scrollbar { width: 9px; }
#tableview::-webkit-scrollbar-thumb { background: #1e3048; border-radius: 8px; }

.tv-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.tv-head h2 { margin: 0; font-size: 16px; font-weight: 640; }
.tv-head span { font-size: 12px; color: var(--dim); }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
th, td { text-align: left; padding: 9px 11px; border-bottom: 1px solid #16232f; vertical-align: top; }
th { color: #7f97ae; font-weight: 600; font-size: 11.5px; letter-spacing: 0.6px; text-transform: uppercase; position: sticky; top: 0; background: rgba(9, 14, 22, 0.96); backdrop-filter: blur(6px); }
tbody tr { cursor: pointer; transition: background 0.14s; }
tbody tr:hover { background: #10202f; }
td.idx { color: #5f7488; width: 30px; }
td.zh { color: #fff; font-weight: 560; }
td.en { color: #93a9bf; font-size: 11.5px; max-width: 340px; }
td.doi { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; color: #7fc4dc; }
td .pv { color: var(--c3); font-size: 11.5px; }

/* ---- misc ---- */
.hint {
  position: absolute; left: 18px; bottom: 14px; font-size: 11.5px; color: #5f7488;
  display: flex; gap: 14px; pointer-events: none; z-index: 5;
}
.hint kbd {
  font: inherit; background: #12202f; border: 1px solid #1e3048; border-bottom-width: 2px;
  border-radius: 5px; padding: 1px 6px; color: #9fb3c8;
}
.legend {
  position: absolute; right: 18px; bottom: 14px; display: flex; gap: 12px; font-size: 11px; color: #6f869c;
  pointer-events: none; z-index: 5;
}
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

#toast {
  position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
  background: #12283c; border: 1px solid #24486a; color: #cfe6f7;
  padding: 9px 16px; border-radius: 9px; font-size: 12.5px;
  opacity: 0; transition: 0.25s; pointer-events: none; z-index: 60;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1180px) {
  #panel { width: 340px; }
  .brand .sub { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>四足机器狗导航 · 10 篇顶刊方案整合</h1>
      <div class="sub">
        <span><b>Science Robotics ×6</b> · <b>IEEE T-RO ×3</b> · <b>IJRR ×1</b></span>
        <span>2022 – 2026</span>
        <span>130 个节点 / 10 篇论文</span>
        <span>DOI、卷期、年份均经 Crossref 核实</span>
      </div>
    </div>
    <div class="toolbar">
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="搜索论文 / 方案 / 关键词" autocomplete="off" spellcheck="false">
      </div>
      <button class="tb on" id="btn-map">思维导图</button>
      <button class="tb" id="btn-table">速查表</button>
      <button class="tb" id="btn-expand">展开全部</button>
      <button class="tb" id="btn-l1">仅一级</button>
      <button class="tb" id="btn-width">适配宽度</button>
      <button class="tb" id="btn-fit">全览</button>
      <button class="tb" id="btn-svg">导出 SVG</button>
      <button class="tb" id="btn-png">导出 PNG</button>
    </div>
  </header>
  <main>
    <div id="canvas">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rootGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#123449"/>
            <stop offset="100%" stop-color="#0b1a27"/>
          </linearGradient>
        </defs>
        <g id="scene"></g>
      </svg>
    </div>
    <div id="tableview"></div>
    <aside id="panel"></aside>
    <div class="hint">
      <span>拖拽平移</span><span>滚轮缩放</span><span>点击节点展开 / 收起</span><span>点击论文看详情</span><span><kbd>0</kbd> 全览</span><span><kbd>1</kbd> 适配宽度</span>
    </div>
  </main>
</div>
<div id="toast"></div>
<script>
// 数据源：四足机器狗导航 · 10 篇顶刊方案整合（纯数据，无 DOM 依赖）
// 所有权重信息（DOI / venue / 年份）均经 Crossref REST API + arXiv Atom API 核实（2026-11-12）。

const PAPERS = {

    venue: 'Science Robotics 7(62), 2022',

    paradigm: '学习派 · 端到端 RL',

    limit: ['无全局导航/无自主寻路', '依赖高程图与状态估计质量', '无语义理解（不懂「草地 vs 玻璃」）', '速度量级低（约 1 m/s）'],
  },

  he2025: {
    short: 'He 2025',

    venue: 'Science Robotics, 2025-08-27',

    arxiv: 'arXiv:2506.09588',

  hoeller: {

      '低层技能库 50 Hz：走 / 跳 / 上攀 / 下攀 / 蹲伏，每类一个参数化 RL 策略，输出关节位置',

// 布局与文本生成核心（纯函数，可在 Node 中直接测试，不依赖 DOM）

const COL_X = [0, 400, 700, 970, 1200, 1400];
const LEAF_GAP = 34;

function colXOf(depth, cols) {
  if (depth < cols.length) return cols[depth];
  return cols[cols.length - 1] + (depth - cols.length + 1) * 250;
}

function hasKids(n) {
  return !!(n.children && n.children.length);
}

// 把树展开成扁平节点数组，同时按「可见性 + 叶子顺序」算出坐标
// cols: 可选的每层列 x 坐标（由前端按文字实测量宽后传入）
function layout(root, collapsed, papers, cols) {
  const collapsedSet = collapsed || new Set();
  const colsX = cols && cols.length ? cols : COL_X;
  const nodes = [];
  const links = [];
  let cursor = 0;

  function idOf(path) {
    return path.join('.');
  }

  function labelOf(node) {
    if (node.paper && papers && papers[node.paper]) return papers[node.paper].zh;
    return node.label || '';
  }

  function visit(node, depth, path, parentIdx) {
    const id = idOf(path);
    const kids = hasKids(node);
    const isCollapsed = collapsedSet.has(id);
    const idx = nodes.push({
      id,
      node,
      depth,
      label: labelOf(node),
      paperKey: node.paper || null,
      paper: node.paper && papers ? papers[node.paper] : null,
      tag: node.paper && papers && papers[node.paper] ? papers[node.paper].venueShort || shortVenue(papers[node.paper]) : '',
      note: node.note || '',
      hasChildren: kids,
      collapsed: isCollapsed,
      x: colXOf(depth, colsX),
      y: 0,
      parent: parentIdx,
      children: [],
      leafCount: 0,
    }) - 1;
    if (parentIdx >= 0) {
      nodes[parentIdx].children.push(idx);
      links.push({ from: parentIdx, to: idx });
    }

    if (kids && !isCollapsed) {
      const start = nodes.length;
      node.children.forEach((c, i) => visit(c, depth + 1, path.concat(i + 1), idx));
      const end = nodes.length;
      if (end === start) {
        nodes[idx].y = cursor;
        cursor += LEAF_GAP;
      } else {
        const firstY = nodes[start].y;
        const lastY = nodes[end - 1].y;
        nodes[idx].y = (firstY + lastY) / 2;
        nodes[idx].leafCount = end - start;
      }
    } else {
      nodes[idx].y = cursor;
      cursor += LEAF_GAP;
      nodes[idx].leafCount = 1;
    }
    return idx;
  }

  visit(root, 0, [0], -1);

  // 以根为中心纵向平移，视觉更平衡
  const ys = nodes.map((n) => n.y);
  const minY = Math.min.apply(null, ys);
  const maxY = Math.max.apply(null, ys);
  const shift = -(minY + maxY) / 2;
  nodes.forEach((n) => {
    n.y += shift;
  });

  const maxX = Math.max.apply(null, nodes.map((n) => n.x));
  const height = maxY - minY + 120;
  const width = maxX + 460;

  return { nodes, links, width, height, minY: -height / 2, maxY: height / 2 };
}

function shortVenue(p) {
  if (!p || !p.venue) return '';
  var m = String(p.venue).match(/^([^,]+),\s*(\d{4})/);
  if (m) return m[1] + ' ' + m[2];
  return p.venue;
}

// 找出所有含 text 的节点及其祖先（用于搜索时自动展开）
function searchMatches(nodes, q) {
  const hit = new Set();
  if (!q) return hit;
  const needle = q.toLowerCase();
  nodes.forEach((n, i) => {
    const p = n.paper;
    let hay = (n.label + ' ' + n.note).toLowerCase();
    if (p) hay += (' ' + p.title + ' ' + p.zh + ' ' + p.venue + ' ' + p.team + ' ' + p.mechanism).toLowerCase();
    if (hay.indexOf(needle) >= 0) {
      hit.add(i);
      let cur = n.parent;
      while (cur >= 0) {
        hit.add(cur);
        cur = nodes[cur].parent;
      }
    }
  });
  return hit;
}

// 从树生成 Markdown（可直接导入 XMind / markmap / 语雀）
function toMarkdown(root, papers) {
  const out = [];
  out.push('# ' + root.label);
  out.push('');
  out.push('> 10 篇顶刊（Science Robotics / IEEE T-RO / IJRR）2022–2026 · 方案整合思维导图');
  out.push('> 生成日期：2026-11-12 · 全部 DOI 经 Crossref 核实');
  out.push('');

  function walk(node, depth) {
    const pad = '  '.repeat(depth);
    if (node.paper && papers[node.paper]) {
      const p = papers[node.paper];
      out.push(pad + '- **' + p.zh + '** · ' + p.short + ' · ' + p.venue);
      out.push(pad + '  - 原题：' + p.title);
      out.push(pad + '  - DOI：' + p.doi + ' · ' + p.arxiv);
      out.push(pad + '  - 团队：' + p.team);
      out.push(pad + '  - 流派：' + p.paradigm);
      out.push(pad + '  - 机制：');
      p.mech.forEach((m) => out.push(pad + '    - ' + m));
      out.push(pad + '  - 创新：');
      p.innov.forEach((m) => out.push(pad + '    - ' + m));
      out.push(pad + '  - 局限：');
      p.limit.forEach((m) => out.push(pad + '    - ' + m));
      return;
    }
    out.push(pad + '- ' + (node.label || ''));
    (node.children || []).forEach((c) => walk(c, depth + 1));
  }

  (root.children || []).forEach((c) => walk(c, 0));
  out.push('');
  out.push('---');
  out.push('');
  out.push('## 附：10 篇顶刊速查表');
  out.push('');
  out.push('| # | 方案 | 论文（原题） | Venue | DOI | 流派 |');
  out.push('|---|---|---|---|---|---|');
  const order = ['miki', 'he2025', 'hoeller', 'lee2024', 'kim2025', 'kang2026', 'grandia', 'zhang2026', 'lin2026', 'bjelonic'];
  order.forEach((k, i) => {
    const p = papers[k];
    out.push('| ' + (i + 1) + ' | ' + p.zh + ' | ' + p.title + ' | ' + p.venue + ' | ' + p.doi + ' | ' + p.paradigm + ' |');
  });
  out.push('');
  return out.join('\n');
}

/* 交互式思维导图渲染（浏览器端） */
(function () {
  'use strict';

  var FONT_STACK = '"Inter","Segoe UI",system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif';
  var PALETTE = ['#4cc9f0', '#f72585', '#ffd166', '#7bf1a8', '#b388ff', '#ff9e6d', '#5ad0c4', '#9fb3c8'];

  var canvasEl = document.getElementById('canvas');
  var svg = document.getElementById('svg');
  var scene = document.getElementById('scene');
  var panel = document.getElementById('panel');
  var tableView = document.getElementById('tableview');
  var toast = document.getElementById('toast');

  var mctx = document.createElement('canvas').getContext('2d');
  function measure(text, size, weight) {
    mctx.font = (weight || 400) + ' ' + size + 'px ' + FONT_STACK;
    return mctx.measureText(text).width;
  }

  var state = {
    collapsed: new Set(),
    k: 1,
    tx: 40,
    ty: 0,
    sel: null,
    query: '',
    view: 'map',
    lay: null,
  };

  function styleOf(depth) {
    if (depth === 0) return { size: 19, weight: 700 };
    if (depth === 1) return { size: 15, weight: 640 };
    if (depth === 2) return { size: 13, weight: 500 };
    return { size: 12.5, weight: 400 };
  }

  function truncateToWidth(text, maxW, size, weight) {
    if (measure(text, size, weight) <= maxW) return text;
    var lo = 1, hi = text.length;
    while (lo < hi) {
      var mid = Math.ceil((lo + hi) / 2);
      if (measure(text.slice(0, mid) + '…', size, weight) <= maxW) lo = mid;
      else hi = mid - 1;
    }
    return text.slice(0, Math.max(1, lo)) + '…';
  }

  // 依据文字实宽计算每层列坐标
  function computeCols(nodes) {
    var maxByDepth = {};
    var maxDepth = 0;
    nodes.forEach(function (n) {
      var s = styleOf(n.depth);
      var w = measure(n.label, s.size, s.weight);
      if (n.paper) w += measure(n.tag, 10.5, 400) + 12;
      w += 26; // dot + 间距
      maxByDepth[n.depth] = Math.max(maxByDepth[n.depth] || 0, w);
      maxDepth = Math.max(maxDepth, n.depth);
    });
    var cols = [];
    var x = 0;
    for (var d = 0; d <= maxDepth; d++) {
      cols.push(x);
      var w = Math.min(maxByDepth[d] || 180, 620);
      x += Math.max(w, 160) + 34;
    }
    return { cols: cols, total: x, maxDepth: maxDepth };
  }

  function build() {
    var full = layout(DATA, new Set(), PAPERS); // 用于测量全部文字（含折叠部分）
    var measured = layout(DATA, state.collapsed, PAPERS);
    var info = computeCols(full.nodes);
    var lay = layout(DATA, state.collapsed, PAPERS, info.cols);
    state.lay = lay;

    // 每条主线颜色 + 祖先链
    var nodes = lay.nodes;
    nodes.forEach(function (n, i) {
      var cur = n;
      var guard = 0;
      while (cur && cur.depth > 1 && guard++ < 10) cur = nodes[cur.parent];
      n.branch = (cur && cur.depth === 1) ? nodes.indexOf(cur) % PALETTE.length : 0;
      n.chain = [];
      var p = n.parent, g = 0;
      while (p >= 0 && g++ < 12) {
        n.chain.push(p);
        p = nodes[p].parent;
      }
    });

    var out = [];
    // 预测量文字宽度（连线要从父节点文字末尾出发，避免压住父标签）
    nodes.forEach(function (n) {
      var st = styleOf(n.depth);
      n.labelW = measure(n.label, st.size, st.weight);
      n.tagW = n.paper ? measure(n.tag, 10.5, 400) + 12 : 0;
    });

    // 连线
    out.push('<g class="links">');
    lay.links.forEach(function (l) {
      var a = nodes[l.from], b = nodes[l.to];
      var x1 = a.depth === 0 ? a.labelW + 46 : a.x + a.labelW + a.tagW + 32;
      var y1 = a.y;
      var x2 = b.x - 9;
      var y2 = b.y;
      var dx = Math.max(26, (x2 - x1) * 0.42);
      var color = PALETTE[b.depth === 1 ? nodes.indexOf(b) % PALETTE.length : b.branch];
      out.push('<path class="link d' + Math.min(3, b.depth) + '" data-a="' + l.from + '" data-b="' + l.to +
        '" d="M' + r(x1) + ',' + r(y1) + ' C' + r(x1 + dx) + ',' + r(y1) + ' ' + r(x2 - dx) + ',' + r(y2) + ' ' + r(x2) + ',' + r(y2) +
        '" stroke="' + color + '"/>');
    });
    out.push('</g>');

    // 节点
    out.push('<g class="nodes">');
    nodes.forEach(function (n, i) {
      var s = styleOf(n.depth);
      var color = PALETTE[n.depth === 1 ? i % PALETTE.length : n.branch];
      var cls = 'node d' + Math.min(3, n.depth) + (n.depth === 0 ? ' root' : '');
      if (n.paper) cls += ' paper';
      var label = n.label;
      var labelW;
      if (n.depth === 0) {
        labelW = measure(label, 19, 700);
        out.push('<g class="' + cls + '" data-i="' + i + '">');
        out.push('<rect class="pillbg" x="0" y="-21" width="' + r(labelW + 40) + '" height="42" rx="21"/>');
        out.push('<circle class="dot" cx="20" cy="0" r="5" fill="' + color + '"/>');
        out.push('<text class="label" x="34" y="1" dominant-baseline="central" fill="#eaf6ff">' + esc(label) + '</text>');
        out.push('</g>');
        return;
      }
      labelW = measure(label, s.size, s.weight);
      var tagW = n.paper ? measure(n.tag, 10.5, 400) + 12 : 0;
      out.push('<g class="' + cls + '" data-i="' + i + '">');
      out.push('<rect class="hit" x="' + r(n.x - 20) + '" y="' + r(n.y - 11) + '" width="' + r(labelW + tagW + 44) + '" height="22" rx="6"/>');
      out.push('<circle class="dot" cx="' + r(n.x) + '" cy="' + r(n.y) + '" r="' + (n.hasChildren ? 5 : 4) + '" fill="' +
        (n.hasChildren ? '#0b1521' : color) + '" stroke="' + color + '" stroke-width="' + (n.hasChildren ? 2.2 : 1.4) + '"/>');
      out.push('<text class="label" x="' + r(n.x + 15) + '" y="' + r(n.y + 1) + '" dominant-baseline="central" fill="' +
        (n.depth === 1 ? '#e6f1fb' : '#c2d3e4') + '" font-weight="' + s.weight + '" font-size="' + s.size + '">' + esc(label) + '</text>');
      if (n.paper) {
        out.push('<text class="tag" x="' + r(n.x + 15 + labelW + 10) + '" y="' + r(n.y + 1) + '" dominant-baseline="central">' + esc(n.tag) + '</text>');
      }
      if (n.hasChildren) {
        out.push('<circle class="plus" cx="' + r(n.x - 13) + '" cy="' + r(n.y) + '" r="7"/>');
        out.push('<text class="plusTxt" x="' + r(n.x - 13) + '" y="' + r(n.y + 0.5) + '" dominant-baseline="central">' + (n.collapsed ? '+' : '−') + '</text>');
      }
      out.push('</g>');
    });
    out.push('</g>');

    scene.innerHTML = out.join('');
    applyTransform();
    if (state.query) applyQuery();
    applySelection();
    return lay;
  }

  function r(v) { return Math.round(v * 100) / 100; }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function applyTransform() {
    scene.setAttribute('transform', 'translate(' + r(state.tx) + ',' + r(state.ty) + ') scale(' + r(state.k) + ')');
  }

  function viewSize() {
    return { w: canvasEl.clientWidth, h: canvasEl.clientHeight };
  }

  function layW() {
    var lay = state.lay;
    var max = 0;
    lay.nodes.forEach(function (n) {
      var s = styleOf(n.depth);
      var w = n.x + measure(n.label, s.size, s.weight) + 40;
      if (n.paper) w += measure(n.tag, 10.5, 400) + 14;
      max = Math.max(max, w);
    });
    return max;
  }

  function fitWidth() {
    var v = viewSize();
    var w = layW();
    var k = Math.max(0.3, Math.min(1.05, (v.w - 90) / w));
    state.k = k;
    state.tx = 46;
    state.ty = v.h / 2;
    applyTransform();
  }

  function fitAll() {
    var v = viewSize();
    var lay = state.lay;
    var w = layW();
    var h = lay.height;
    var k = Math.min((v.w - 70) / w, (v.h - 70) / h, 1.1);
    state.k = Math.max(0.16, k);
    state.tx = (v.w - w * state.k) / 2;
    state.ty = v.h / 2;
    applyTransform();
  }

  // ---------- 交互 ----------
  var drag = { on: false, x: 0, y: 0, moved: 0, pid: null };

  canvasEl.addEventListener('pointerdown', function (e) {
    if (e.target.closest('#panel')) return;
    drag.on = true;
    drag.x = e.clientX;
    drag.y = e.clientY;
    drag.moved = 0;
    drag.pid = e.pointerId;
    canvasEl.classList.add('dragging');
  });

  window.addEventListener('pointermove', function (e) {
    if (!drag.on) return;
    var dx = e.clientX - drag.x;
    var dy = e.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    state.tx += dx;
    state.ty += dy;
    drag.x = e.clientX;
    drag.y = e.clientY;
    applyTransform();
  });

  window.addEventListener('pointerup', function () {
    drag.on = false;
    canvasEl.classList.remove('dragging');
  });

  canvasEl.addEventListener('wheel', function (e) {
    if (e.target.closest('#panel')) return;
    e.preventDefault();
    var rect = canvasEl.getBoundingClientRect();
    var px = e.clientX - rect.left;
    var py = e.clientY - rect.top;
    var factor = Math.pow(1.0016, -e.deltaY);
    var k2 = Math.max(0.15, Math.min(3.2, state.k * factor));
    state.tx = px - (px - state.tx) * (k2 / state.k);
    state.ty = py - (py - state.ty) * (k2 / state.k);
    state.k = k2;
    applyTransform();
  }, { passive: false });

  scene.addEventListener('click', function (e) {
    if (drag.moved > 6) return;
    var g = e.target.closest('.node');
    if (!g) return;
    var i = Number(g.getAttribute('data-i'));
    var n = state.lay.nodes[i];
    if (!n) return;
    if (n.paper) {
      select(i);
    } else if (n.hasChildren) {
      if (state.collapsed.has(n.id)) state.collapsed.delete(n.id);
      else state.collapsed.add(n.id);
      build(); // 保留当前缩放/平移，避免每次展开都跳视野
    } else {
      select(i);
    }
  });

  function select(i) {
    state.sel = i;
    applySelection();
    renderPanel(state.lay.nodes[i]);
    panel.classList.add('open');
  }

  function applySelection() {
    var sel = scene.querySelectorAll('.node.sel');
    for (var i = 0; i < sel.length; i++) sel[i].classList.remove('sel');
    if (state.sel == null || !state.lay) return;
    var g = scene.querySelector('.node[data-i="' + state.sel + '"]');
    if (g) g.classList.add('sel');
  }

  function applyQuery() {
    var q = state.query.trim();
    var all = scene.querySelectorAll('.node');
    var paths = scene.querySelectorAll('.link');
    if (!q) {
      for (var i = 0; i < all.length; i++) all[i].classList.remove('dim', 'hit-match');
      for (var j = 0; j < paths.length; j++) paths[j].classList.remove('dim', 'hl');
      return;
    }
    var hits = new Set();
    state.lay.nodes.forEach(function (n, idx) {
      var p = n.paper;
      var hay = (n.label + ' ' + (n.note || '')).toLowerCase();
      if (p) hay += ' ' + (p.title + ' ' + p.zh + ' ' + p.venue + ' ' + p.team + ' ' + p.paradigm + ' ' + p.mech.join(' ')).toLowerCase();
      if (hay.indexOf(q.toLowerCase()) >= 0) hits.add(idx);
    });
    state.lay.nodes.forEach(function (n, idx) {
      var g = scene.querySelector('.node[data-i="' + idx + '"]');
      if (!g) return;
      g.classList.toggle('dim', !hits.has(idx));
      g.classList.toggle('hit-match', hits.has(idx));
    });
    for (var k = 0; k < paths.length; k++) {
      var a = Number(paths[k].getAttribute('data-a'));
      var b = Number(paths[k].getAttribute('data-b'));
      var hot = hits.has(a) && hits.has(b);
      paths[k].classList.toggle('hl', hot);
      paths[k].classList.toggle('dim', !hot);
    }
  }

  // ---------- 右侧面板 ----------
  function renderPanel(n) {
    if (!n) return;
    var html = [];
    if (n.paper) {
      var p = n.paper;
      html.push('<div class="p-top"><div><div class="p-venue">' + esc(p.venue) + '</div>');
      html.push('<h2>' + esc(p.zh) + '</h2>');
      html.push('<div class="en">' + esc(p.title) + '</div></div>');
      html.push('<button class="p-close" onclick="document.getElementById(\'panel\').classList.remove(\'open\')">✕</button></div>');
      html.push('<div class="meta">');
      html.push('<div class="k">团队</div><div class="v">' + esc(p.team) + '</div>');
      html.push('<div class="k">流派</div><div class="v">' + esc(p.paradigm) + '</div>');
      html.push('<div class="k">DOI</div><div class="v"><a href="https://doi.org/' + esc(p.doi) + '" target="_blank" rel="noopener">' + esc(p.doi) + '</a></div>');
      if (p.arxiv) html.push('<div class="k">预印本</div><div class="v">' + esc(p.arxiv) + '</div>');
      html.push('</div>');
      html.push('<div class="p-sec"><h3>方案机制</h3><ul>' + p.mech.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul></div>');
      html.push('<div class="p-sec innov"><h3>关键创新</h3><ul>' + p.innov.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul></div>');
      html.push('<div class="p-sec limit"><h3>局限 / 空白</h3><ul>' + p.limit.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul></div>');
    } else {
      html.push('<div class="p-top"><div><div class="p-venue">思维导图节点</div>');
      html.push('<h2>' + esc(n.label) + '</h2></div>');
      html.push('<button class="p-close" onclick="document.getElementById(\'panel\').classList.remove(\'open\')">✕</button></div>');
      if (n.note) html.push('<p style="font-size:12.5px;line-height:1.6;color:#b9cbdd">' + esc(n.note) + '</p>');
      if (n.hasChildren) {
        var kids = state.lay.nodes.filter(function (x) { return x.parent === state.lay.nodes.indexOf(n); });
        html.push('<div class="p-sec"><h3>下级节点（' + kids.length + '）</h3><ul>' +
          kids.map(function (k) { return '<li>' + esc(k.label) + '</li>'; }).join('') + '</ul></div>');
      }
      html.push('<p style="font-size:12px;color:#6f869c;line-height:1.6">点击圆点旁节点可展开/收起该分支。</p>');
    }
    panel.innerHTML = html.join('');
  }

  // ---------- 表格视图 ----------
  function renderTable() {
    var order = ['miki', 'he2025', 'hoeller', 'lee2024', 'kim2025', 'kang2026', 'grandia', 'zhang2026', 'lin2026', 'bjelonic'];
    var rows = order.map(function (k, i) {
      var p = PAPERS[k];
      return '<tr data-k="' + k + '"><td class="idx">' + (i + 1) + '</td>' +
        '<td class="zh">' + esc(p.zh) + '<div class="pv">' + esc(p.paradigm) + '</div></td>' +
        '<td class="en">' + esc(p.title) + '</td>' +
        '<td>' + esc(p.venue) + '</td>' +
        '<td class="doi">' + esc(p.doi) + '</td></tr>';
    }).join('');
    tableView.innerHTML = '<div class="tv-head"><h2>10 篇顶刊速查表</h2><span>点击任意一行回到导图并定位</span></div>' +
      '<table><thead><tr><th>#</th><th>方案</th><th>英文原题</th><th>Venue</th><th>DOI</th></tr></thead><tbody>' + rows + '</tbody></table>';
    tableView.querySelectorAll('tbody tr').forEach(function (tr) {
      tr.addEventListener('click', function () {
        var k = tr.getAttribute('data-k');
        switchView('map');
        var idx = -1;
        state.lay.nodes.forEach(function (n, i) { if (n.paperKey === k) idx = i; });
        if (idx >= 0) {
          // 确保祖先展开
          var chain = state.lay.nodes[idx].chain;
          chain.forEach(function (pi) { state.collapsed.delete(state.lay.nodes[pi].id); });
          build();
          fitWidth();
          var idx2 = -1;
          state.lay.nodes.forEach(function (n, i) { if (n.paperKey === k) idx2 = i; });
          select(idx2);
        }
      });
    });
  }

  // ---------- 视图切换 ----------
  function switchView(v) {
    state.view = v;
    var btnMap = document.getElementById('btn-map');
    var btnTable = document.getElementById('btn-table');
    if (v === 'map') {
      tableView.classList.remove('show');
      btnMap.classList.add('on');
      btnTable.classList.remove('on');
    } else {
      tableView.classList.add('show');
      btnTable.classList.add('on');
      btnMap.classList.remove('on');
      panel.classList.remove('open');
    }
  }

  // ---------- 导出 ----------
  function buildExportSVG() {
    var lay = state.lay;
    var w = layW() + 80;
    var h = lay.height + 80;
    var clone = svg.cloneNode(true);
    clone.setAttribute('width', w);
    clone.setAttribute('height', h);
    clone.setAttribute('viewBox', '-40 ' + (-h / 2) + ' ' + w + ' ' + h);
    var s = clone.querySelector('#scene');
    s.setAttribute('transform', 'translate(0,0) scale(1)');
    clone.querySelectorAll('.dim').forEach(function (el) { el.classList.remove('dim'); });
    clone.querySelectorAll('.hit-match,.sel').forEach(function (el) { el.classList.remove('hit-match', 'sel'); });
    var bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('x', '-40');
    bg.setAttribute('y', -h / 2);
    bg.setAttribute('width', w);
    bg.setAttribute('height', h);
    bg.setAttribute('fill', '#0a1119');
    clone.insertBefore(bg, clone.firstChild);
    var str = new XMLSerializer().serializeToString(clone);
    if (str.indexOf('xmlns=') < 0) str = str.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
    return { str: str, w: w, h: h };
  }

  function download(name, href) {
    var a = document.createElement('a');
    a.href = href;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.remove('show'); }, 1900);
  }

  document.getElementById('btn-svg').addEventListener('click', function () {
    var out = buildExportSVG();
    var blob = new Blob([out.str], { type: 'image/svg+xml;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    download('四足机器狗导航_顶刊方案思维导图.svg', url);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    showToast('已导出 SVG（矢量，可拖进 PPT / Word）');
  });

  document.getElementById('btn-png').addEventListener('click', function () {
    var out = buildExportSVG();
    var blob = new Blob([out.str], { type: 'image/svg+xml;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var img = new Image();
    img.onload = function () {
      var scale = Math.min(2, 8000 / Math.max(out.w, out.h));
      var cv = document.createElement('canvas');
      cv.width = Math.round(out.w * scale);
      cv.height = Math.round(out.h * scale);
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#0a1119';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(function (b) {
        var u = URL.createObjectURL(b);
        download('四足机器狗导航_顶刊方案思维导图.png', u);
        setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
        showToast('已导出 PNG（长图，适合贴文档）');
      }, 'image/png');
      URL.revokeObjectURL(url);
    };
    img.onerror = function () { showToast('PNG 导出失败，请改用 SVG'); };
    img.src = url;
  });

  // ---------- 顶部按钮 ----------
  document.getElementById('btn-expand').addEventListener('click', function () {
    state.collapsed.clear();
    build();
    fitWidth();
  });
  document.getElementById('btn-l1').addEventListener('click', function () {
    state.collapsed.clear();
    state.lay.nodes.forEach(function (n) { if (n.depth === 1) state.collapsed.add(n.id); });
    build();
    fitWidth();
  });
  document.getElementById('btn-fit').addEventListener('click', fitAll);
  document.getElementById('btn-width').addEventListener('click', fitWidth);
  document.getElementById('btn-map').addEventListener('click', function () { switchView('map'); });
  document.getElementById('btn-table').addEventListener('click', function () { switchView('table'); });

  var searchInput = document.getElementById('q');
  var searchTimer = null;
  searchInput.addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.query = searchInput.value;
      applyQuery();
    }, 120);
  });

  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'INPUT') {
      if (e.key === 'Escape') { searchInput.value = ''; state.query = ''; applyQuery(); searchInput.blur(); }
      return;
    }
    if (e.key === 'Escape') panel.classList.remove('open');
    else if (e.key === '0') fitAll();
    else if (e.key === '1') fitWidth();
    else if (e.key === '+' || e.key === '=') { state.k = Math.min(3.2, state.k * 1.15); applyTransform(); }
    else if (e.key === '-') { state.k = Math.max(0.15, state.k / 1.15); applyTransform(); }
  });

  window.addEventListener('resize', function () { fitWidth(); });

  // ---------- 启动 ----------
  build();
  renderTable();
  fitWidth();
  // 桌面端首屏略微放大
  if (window.innerWidth > 1500) {
    state.k = Math.min(1.05, state.k * 1.08);
    applyTransform();
  }
})();
</script>
</body>
</html>
